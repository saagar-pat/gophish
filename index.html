<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Web Services Sign-In</title>
    <!-- Website Favicon using the official orange AWS cube icon -->
    <link rel="icon" type="image/png" href="https://a0.awsstatic.com/libra-css/images/site/fav/favicon.ico">
    <style>
        body {
            font-family: "Amazon Ember", "Helvetica Neue", Roboto, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #16191f;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Images reverted to original size with a slight darkening filter */
        .bg-left {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 25vw;
            max-width: 400px;
            height: auto;
            z-index: -1;
            pointer-events: none;
            filter: brightness(0.85);
        }

        .bg-right {
            position: fixed;
            right: 0;
            bottom: 0;
            width: 25vw;
            max-width: 400px;
            height: auto;
            z-index: -1;
            pointer-events: none;
            filter: brightness(0.85);
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 32px;
            font-size: 13px;
            font-family: inherit;
            gap: 28px;
        }
        header a {
            color: #0073bb;
            text-decoration: none;
            font-family: inherit;
        }
        header a:hover {
            text-decoration: underline;
        }
        .header-dropdown {
            color: #0073bb;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
        }
        .header-dropdown:hover {
            text-decoration: underline;
        }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
            z-index: 1;
        }

        .aws-logo {
            margin-bottom: 8px;
            text-align: center;
        }

        .aws-logo img {
            width: 70px;
            height: auto;
        }

        /* Simulated Phishing Attack Banner Text */
        .phishing-banner-text {
            font-size: 20px;
            font-weight: 800;
            color: #d13212;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-align: center;
            font-family: inherit;
        }

        /* No Data Collected Sub-banner Text */
        .phishing-sub-text {
            font-size: 14px;
            font-weight: 700;
            color: #565f66;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-align: center;
            font-family: inherit;
        }

        /* Wrapper for left column (form + agreement text) */
        .content-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 32px;
            max-width: 860px;
            width: 100%;
            justify-content: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            flex-shrink: 0;
        }

        /* Card Container */
        .signin-container {
            background: #ffffff;
            border: 1px solid #d5d7d9;
            border-radius: 16px;
            width: 100%;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 6px;
            color: #16191f;
            letter-spacing: -0.2px;
            font-family: inherit;
        }

        .subtitle {
            font-size: 13px;
            color: #565f66;
            margin-bottom: 20px;
            line-height: 1.4;
            font-family: inherit;
        }

        .section-label {
            font-size: 13px;
            font-weight: normal;
            color: #16191f;
            margin-bottom: 8px;
            font-family: inherit;
        }

        .section-label a {
            font-weight: normal;
            color: #0073bb;
            text-decoration: none;
            font-family: inherit;
        }

        .section-label a:hover {
            text-decoration: underline;
        }

        /* Radio Options Box */
        .radio-card {
            border: 1px solid #d5d7d9;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .radio-card:hover {
            border-color: #0073bb;
        }

        .radio-card label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            font-family: inherit;
        }

        .radio-card input[type="radio"] {
            accent-color: #0073bb;
            margin-right: 10px;
            margin-top: 2px;
            transform: scale(1.1);
            flex-shrink: 0;
        }

        .radio-content {
            display: flex;
            flex-direction: column;
        }

        .radio-title {
            font-size: 13px;
            font-weight: normal;
            color: #16191f;
            font-family: inherit;
        }

        .radio-desc {
            font-size: 12px;
            color: #565f66;
            margin-top: 4px;
            line-height: 1.4;
            font-family: inherit;
        }

        /* Input Field */
        .input-group {
            margin-top: 16px;
            margin-bottom: 16px;
            font-family: inherit;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: normal;
            color: #16191f;
            margin-bottom: 8px;
            font-family: inherit;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #aab7b8;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            color: #16191f;
            font-family: inherit;
        }

        /* Italic Placeholder Styling */
        .input-group input::placeholder {
            font-style: italic;
            color: #565f66;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0073bb;
            box-shadow: 0 0 0 3px rgba(0, 115, 187, 0.15);
        }

        /* Buttons */
        .btn-primary {
            background-color: #ff9900;
            color: #16191f;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }

        .btn-primary:hover {
            background-color: #ec8e00;
        }

        .divider {
            text-align: center;
            position: relative;
            margin: 16px 0;
            font-size: 12px;
            color: #565f66;
            font-weight: 700;
            font-family: inherit;
        }

        .btn-secondary {
            background-color: transparent;
            color: #0073bb;
            border: 1px solid #0073bb;
            border-radius: 20px;
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .btn-secondary:hover {
            background-color: rgba(0, 115, 187, 0.05);
        }

        /* Footer Text underneath the card (Left Aligned) */
        .footer-text {
            font-size: 11px;
            color: #565f66;
            text-align: left;
            margin-top: 16px;
            padding: 0 4px;
            line-height: 1.4;
            font-family: inherit;
        }

        .footer-text a {
            color: #0073bb;
            text-decoration: none;
            font-family: inherit;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Page Bottom Footer */
        .page-footer {
            text-align: center;
            font-size: 11px;
            color: #565f66;
            padding: 20px;
            margin-top: auto;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <!-- Instructions for robots meta tag to block search engines and web security scanners -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

    <!-- Background Graphics -->
    <img src="https://signin.aws.amazon.com/v2/assets/background-left.png" alt="" class="bg-left">
    <img src="https://signin.aws.amazon.com/v2/assets/background-right.png" alt="" class="bg-right">

    <header>
        <a href="#">Provide feedback</a>
        <a href="#" class="header-dropdown">Multi-session disabled ▼</a>
        <a href="#" class="header-dropdown">English ▼</a>
    </header>

    <div class="main-content">
        <div class="aws-logo">
            <img src="https://signin.aws.amazon.com/v2/assets/_next/static/media/aws-logo@2x.7c50e6f9.png" alt="AWS Logo">
        </div>
        <div class="phishing-banner-text">SIMULATED PHISHING ATTACK</div>
        <div class="phishing-sub-text">NO DATA COLLECTED OR STORED</div>

        <div class="content-row">
            <div class="left-column">
                <!-- SINGLE VIEW: User Type & Email Selection -->
                <div class="signin-container">
                    <h1>Simulated</h1>
                    <div class="subtitle">Access your AWS account by user type.</div>

                    <div class="section-label">
                        User type <a href="#">(not sure?)</a>
                    </div>

                    <div class="radio-card" onclick="document.getElementById('root-radio').checked = true;">
                        <label>
                            <input type="radio" id="root-radio" name="user_type" value="Root user" checked>
                            <div class="radio-content">
                                <span class="radio-title">Root user</span>
                                <div class="radio-desc">Account owner that performs tasks requiring unrestricted access.</div>
                            </div>
                        </label>
                    </div>

                    <div class="radio-card" onclick="document.getElementById('iam-radio').checked = true;">
                        <label>
                            <input type="radio" id="iam-radio" name="user_type" value="IAM user">
                            <div class="radio-content">
                                <span class="radio-title">IAM user</span>
                                <div class="radio-desc">User within an account that performs daily tasks.</div>
                            </div>
                        </label>
                    </div>

                    <button type="button" class="btn-primary" id="next-btn">Next</button>

                    <div class="divider">OR</div>

                    <button type="button" class="btn-secondary">New to AWS?</button>
                </div>

                <!-- Agreement Footer Text placed underneath the card box with left alignment -->
                <div class="footer-text">
                    This is a Simulated Page!
                </div>
            </div>
        </div>
    </div>

    <div class="page-footer">
        &copy; 2026 Amazon Web Services, Inc. or its affiliates. All rights reserved.
    </div>

</body>
</html>
